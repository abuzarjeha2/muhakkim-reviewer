kind = "web"
previewPath = "/"
title = "Muhakkim — Academic Peer Review"
version = "1.0.0"
id = "artifacts/muhakkim"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20693

[services.development]
run = "pnpm --filter @workspace/muhakkim run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/muhakkim", "run", "build" ]
publicDir = "artifacts/muhakkim/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20693"
BASE_PATH = "/"
