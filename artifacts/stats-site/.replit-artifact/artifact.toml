kind = "web"
previewPath = "/stats-site/"
title = "موقع الخدمات الإحصائية"
version = "1.0.0"
id = "artifacts/stats-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/stats-site/" ]
localPort = 18423

[services.development]
run = "pnpm --filter @workspace/stats-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stats-site", "run", "build" ]
publicDir = "artifacts/stats-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18423"
BASE_PATH = "/stats-site/"
